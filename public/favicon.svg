<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5ECD5" />
      <stop offset="50%" stop-color="#E0B86A" />
      <stop offset="100%" stop-color="#C8973A" />
    </linearGradient>
  </defs>
  <!-- Background circular shield -->
  <circle cx="256" cy="256" r="230" fill="#1A3C2E" stroke="url(#gold)" stroke-width="16" />
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6" />
  
  <!-- Mountains/Golf Hills in the background -->
  <path d="M 90 380 L 190 280 L 270 340 L 370 230 L 422 280" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Elegant Centered Monogram / Symbol: Pine Tree + Golf Flag + Mountains -->
  <g transform="translate(256, 260)">
    <!-- Left Hill -->
    <path d="M -130 90 L -60 20 L 0 80" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Hill (Sierra) -->
    <path d="M -20 90 L 50 10 L 130 80" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Pine Tree -->
    <g transform="translate(0, -60)">
      <!-- Trunk -->
      <line x1="0" y1="50" x2="0" y2="150" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" />
      <!-- Tree triangles -->
      <path d="M -60 50 L 60 50 L 0 -20 Z" fill="url(#gold)" />
      <path d="M -45 -10 L 45 -10 L 0 -70 Z" fill="url(#gold)" />
      <path d="M -30 -60 L 30 -60 L 0 -110 Z" fill="url(#gold)" />
    </g>
  </g>
</svg>